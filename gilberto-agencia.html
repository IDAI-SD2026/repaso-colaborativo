
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de Viajes</title>
</head>
<body>

    <h1>Agencia de Viajes</h1>
    <p>Llena el siguiente formulario para elegir tu próximo viaje.</p>

    <ul>
    <li>
        <a href="gilberto-agencia.html">Agencia de Viajes</a>
    </li>
</ul>

    <form>

        <fieldset>
            <legend>Datos del viajero</legend>

            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>

            <br>

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" required>

        </fieldset>

        <br>

        <fieldset>
            <legend>Selecciona tu paquete</legend>

            <input type="radio" id="mochilero" name="paquete" value="3500" required>
            <label for="mochilero">Mochilero - $3,500</label>

            <br>

            <input type="radio" id="incluido" name="paquete" value="7800">
            <label for="incluido">Todo Incluido - $7,800</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Servicios adicionales</legend>

            <input type="checkbox" id="seguro" name="servicios" value="450">
            <label for="seguro">Seguro de viajero (+$450)</label>

            <br>

            <input type="checkbox" id="tour" name="servicios" value="800">
            <label for="tour">Tour guiado (+$800)</label>

        </fieldset>

        <br>

        <fieldset>
            <legend>Temporada del viaje</legend>

            <label for="temporada">Selecciona la temporada:</label>

            <select id="temporada" name="temporada" required>
                <option value="">Selecciona una opción</option>
                <option value="0">Temporada Baja (Gratis)</option>
                <option value="1200">Temporada Alta (+$1,200)</option>
            </select>

        </fieldset>

        <br>

        <button type="submit">Enviar reservación</button>
        <button type="reset">Cancelar</button>

    </form>


</body>
</html>
