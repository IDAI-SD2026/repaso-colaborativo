<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador-Armado de PCs</title>

  <!-- SPRINT 2 (Lunes): Cambia "plantilla.css" por el nombre de tu archivo CSS (ej. equipo1.css) -->
  <link rel="stylesheet" href="fernando-armadopcs.css">
</head>
<body>

  <nav class="barra-volver">
    <a href="index.html">← Volver al menú principal</a>
  </nav> 

  <div class="maincontenedor">
  <div class="imagenes">
      <img src="IMG-armadopcs/pcgamer.jpg" alt="pcgamer">
      <img src="IMG-armadopcs/pcgamer2.webp" alt="pcgamer">
  </div>

  <main class="contenedor">
    <h1>Cotizador de [Tu Producto/Servicio]</h1>
    <p>Completa los datos para calcular el precio total.</p>

    <!-- =================================================================
         SPRINT 1 (Jueves y Viernes): FORMULARIO HTML5
         Requisitos:
         1. Usar <fieldset> y <legend> para agrupar secciones.
         2. Vincular cada <label for="id"> con su <input id="id">.
         3. Incluir: number, radio, checkbox y select.
    ================================================================== -->
    <form id="formularioCotizador">

      <!-- SECCIÓN 1: Datos básicos y cantidad -->
      <fieldset class="grupo-campos">
        <legend>1. Información de tu PC</legend>

        <div class="campo">
          <label for="nombreCliente">Nombre del cliente:</label>
          <input type="text" id="nombreCliente" placeholder="Ej. Luis Hernandez" required>
        </div>

        <div class="campo">
          <label for="cantidad">Cantidad:</label>
          <input type="number" id="cantidad" value="1" min="1" max="50" required>
        </div>
      </fieldset>

      <!-- SECCIÓN 2: Opciones excluyentes (Radio) -->
      <fieldset class="grupo-campos">
        <legend>2. Elige una gama para tu PC</legend>
        
        <label class="opcion-linea">
          <input type="radio" name="planBase" id="planBasico" value="12,000" checked>
          Gama baja ($12,000)
        </label>

        <label class="opcion-linea">
          <input type="radio" name="planBase" id="planPremium" value="20,000">
          Gama media ($20,000)
        </label>

        <label class="opcion-linea">
          <input type="radio" name="planBase" id="planPro" value="35,000">
          Gama alta ($35,000)
        </label>
        
        <label class="opcion-linea">
          <input type="radio" name="planBase" id="planUltra" value="65,000">
          Gama ultra ($65,000)
        </label>

      </fieldset>

      <!-- SECCIÓN 3: Extras opcionales (Checkbox) -->
      <fieldset class="grupo-campos">
        <legend>3. Agrega periféricos</legend>

        <label class="opcion-linea">
          <input type="checkbox" id="monitor144" value="7700">
          Monitor 144hz 1440p (+$7,700)
        </label>

        <label class="opcion-linea">
          <input type="checkbox" id="tecladomec" value="2500">
          Teclado mecánico (+$2500)
        </label>
      </fieldset>

      <fieldset class="grupo-campos">
        <legend>4. Agrega software</legend>

        <label class="opcion-linea">
          <input type="checkbox" id="win11" value="5000">
          Licencia de Windows 11 (+$5,000)
        </label>

        <label class="opcion-linea">
          <input type="checkbox" id="office" value="3000">
          Licencia de Office (+$3,000)
        </label>
      </fieldset>

      <fieldset class="grupo-campos">
        <legend>5. Agregar componentes</legend>

        <label class="opcion-linea">
          <input type="checkbox" id="+RAM" value="1900">
          + 8GB RAM (+$1,900)
        </label>

        <label class="opcion-linea">
          <input type="checkbox" id="refliquida" value="5900">
          Refrigeración liquida (+$5,900)
        </label>
      </fieldset>
      <!-- SECCIÓN 4: Lista desplegable (Select) -->
      <fieldset class="grupo-campos">
        <legend>6. Método de entrega</legend>
        
        <div class="campo">
          <label for="tipoEntrega">Selecciona entrega:</label>
          <select id="tipoEntrega">
            <option value="tienda">Recoger en tienda (Gratis)</option>
            <option value="domicilio">Envío a domicilio (+$250)</option>
          </select>
        </div>
      </fieldset>

      <!-- Botón type="button" para que JS lo controle sin recargar la página -->
      <button type="button" id="btnCalcular" class="btn-principal">Calcular Total</button>

    </form>

    <!-- Caja donde JavaScript mostrará el resultado en el Sprint 3 -->
    <div id="cajaResultado" class="resultado">
      Aquí aparecerá el resumen de tu cotización.
    </div>
  </main>
  </div>

  <!-- SPRINT 3 (Jueves 2): Cambia "plantilla.js" por el nombre de tu archivo JS (ej. equipo1.js) -->
  <script src="plantilla.js"></script>
</body>
</html>
